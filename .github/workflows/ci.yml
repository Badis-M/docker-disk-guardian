name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --extra dev
      - run: make lint typecheck coverage
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
      - run: make audit
  package:
    needs: [quality, security, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --extra dev --group build
      - run: make build
      - name: Install and smoke-test wheel and source distribution independently
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/runtime.txt"
          for artifact in dist/*.whl dist/*.tar.gz; do
            prefix="$RUNNER_TEMP/installed-$(basename "$artifact")"
            uv venv "$prefix" --python '3.12'
            uv pip install --python "$prefix/bin/python" --require-hashes -r "$RUNNER_TEMP/runtime.txt"
            uv pip install --python "$prefix/bin/python" --no-deps --only-binary :all: dist/*.whl
            if [[ "$artifact" == *.tar.gz ]]; then
              mkdir "$RUNNER_TEMP/sdist"
              tar -xzf "$artifact" -C "$RUNNER_TEMP/sdist"
              source_dir=$(find "$RUNNER_TEMP/sdist" -mindepth 1 -maxdepth 1 -type d)
              uv run --locked --group build python -m build --wheel --no-isolation "$source_dir" --outdir "$RUNNER_TEMP/rebuilt"
              uv pip install --python "$prefix/bin/python" --no-deps --reinstall "$RUNNER_TEMP"/rebuilt/*.whl
            fi
            "$prefix/bin/python" scripts/check_distribution.py
          done
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          retention-days: 14
          if-no-files-found: error
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.12'
      DDG_RUN_INTEGRATION: '1'
      DDG_TEST_IMAGE: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.6'
      - name: Prepare the explicit fixture image on this disposable runner
        run: docker pull "$DDG_TEST_IMAGE"
      - run: uv run --locked --extra dev pytest -m integration
