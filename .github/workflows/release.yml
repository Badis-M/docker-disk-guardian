name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag on main, explicitly approved for publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing tag, version and main ancestry
        run: python3 scripts/check_release.py "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - name: Verify checksums before publishing the tested artifacts
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish the explicitly requested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
